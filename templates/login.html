<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="icon" href="{{ url_for('image_file', filename='cinnamon.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: #f4f4f4; /* Replaced background image with solid color */
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        /* Navbar */
        .navbar {
            background: #0d3b0d;
        }
        .navbar .nav-link {
            color: #fff;
            transition: 0.3s;
        }
        .navbar .nav-link:hover {
            color: #a5d6a7;
        }
        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px); /* Adjust for navbar height */
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(27, 79, 42, 0.3); /* Green color shadow */
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }
        .login-box:hover {
            transform: translateY(-5px);
        }
        .login-box h2 {
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
            text-align: center;
        }
        .form-group label {
            color: #333;
            font-weight: 500;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 10px;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #1B4F2A;
            box-shadow: 0 0 8px rgba(27, 79, 42, 0.2);
        }
        .btn-primary {
            background-color: #1B4F2A;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #2A7A3F;
        }
        .text-danger {
            font-size: 0.9rem;
        }
        .form-check {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="#">CINNAGURD</a>
    </nav>

    <!-- Admin Login Form -->
    <div class="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <form action="{{ url_for('admin_login') }}" method="post">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                    <div class="form-check">
                        <input type="checkbox" id="showPassword" class="form-check-input">
                        <label class="form-check-label" for="showPassword">Show Password</label>
                    </div>
                </div>
                <button type="submit" name="login" class="btn btn-primary btn-block">Login</button>
                {% if error %}
                <p class="text-danger text-center mt-3">{{ error }}</p>
                {% endif %}
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('showPassword').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            passwordInput.type = this.checked ? 'text' : 'password';
        });
    </script>
</body>
</html>
